name: Publish delegated service release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: Stable version in vMAJOR.MINOR.PATCH form.
      image-reference:
        required: true
        type: string
        description: Verified registry image reference pinned by SHA-256.
      package-reference:
        required: true
        type: string
        description: Verified registry manifest package reference pinned by SHA-256.
      package-artifact-id:
        required: true
        type: string
        description: ID of the package workflow artifact from this run.
      evidence-artifact-id:
        required: true
        type: string
        description: Artifact ID from this run containing the service contract, SBOM and registry/provenance evidence.
    outputs:
      release-id:
        value: ${{ jobs.cut.outputs.release-id }}
        description: Verified immutable release ID.

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  cut:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected
    environment: service-release-cut
    concurrency:
      group: service-release-cut-${{ inputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      IMAGE_REFERENCE: ${{ inputs.image-reference }}
      PACKAGE_REFERENCE: ${{ inputs.package-reference }}
      PACKAGE_ARTIFACT_ID: ${{ inputs.package-artifact-id }}
      TRUSTED_CUT_WORKFLOW: ${{ vars.RELEASE_CUT_WORKFLOW_REF }}
      RELEASE_HANDOFF_ENABLED: ${{ vars.RELEASE_HANDOFF_ENABLED }}
      RELEASE_TRIGGER_ACTOR_ID: ${{ vars.RELEASE_TRIGGER_ACTOR_ID }}
      RELEASE_TRIGGER_LOGIN: ${{ vars.RELEASE_TRIGGER_LOGIN }}
    outputs:
      release-id: ${{ steps.cut.outputs.release-id }}
    steps:
      - name: Require the shared workflow revision
        env:
          SHARED_REPOSITORY: ${{ job.workflow_repository }}
          SHARED_REVISION: ${{ job.workflow_sha }}
        run: |
          test "$SHARED_REPOSITORY" = teric-io/.github
          [[ "$SHARED_REVISION" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Bind both artifacts to the protected run
        env:
          EVIDENCE_ARTIFACT_ID: ${{ inputs.evidence-artifact-id }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.package-artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tooling/scripts/service-release/release.py artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.evidence-artifact-id }}
          path: evidence
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.package-artifact-id }}
          path: package
          merge-multiple: true
      - name: Verify artifacts and the delegated release request
        env:
          APPROVED_IMAGE_REPOSITORY: ${{ vars.RELEASE_IMAGE_REPOSITORY }}
          APPROVED_PACKAGE_REPOSITORY: ${{ vars.RELEASE_PACKAGE_REPOSITORY }}
        run: |
          python3 -I tooling/scripts/service-release/release.py prepare
          python3 -I tooling/scripts/service-release/publisher.py authorize
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.RELEASE_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.RELEASE_PUBLISHER_REGION }}
          role-duration-seconds: 900
      - id: cut
        name: Publish and verify the immutable release
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_INSTALLATION_ID: ${{ vars.RELEASE_INSTALLATION_ID }}
          RELEASE_APP_BOT_ID: ${{ vars.RELEASE_APP_BOT_ID }}
          PUBLISHER_SECRET_ARN: ${{ vars.RELEASE_PUBLISHER_SECRET_ARN }}
        run: python3 -I tooling/scripts/service-release/publisher.py publish
